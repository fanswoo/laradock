# Sync Streams 定義（edition 3 語法）
#
# PowerSync 1.20.5 edition 3 函式 schema（grep 自 /app/packages/sync-rules/dist/compiler/sqlite.js:102）：
#   合法 schema 只有 auth / subscription / connection，其他會回 "Invalid schema in function name"
#   auth.user_id()                — JWT sub claim（字串；PHP controller 做 (string) 轉型）
#   auth.parameter('x')           — JWT root-level 'x' 欄位（經 sqlite.js 405 行 desugar 為
#                                     auth.parameters() ->> 'x'；不是 nested `parameters.x`）
#   subscription.parameter('x')   — 前端 db.syncStream(name, {x}) 傳入的 subscription 參數
#
# ⚠️ 禁用 SQL alias：PowerSync 會把 alias 當 output table name 存進 bucket（`table: "c"`），
# client 端沒有 ps_data__c 這種 table，資料會被丟掉。必須用完整 table 名稱寫 query。
#
# 架構備忘：edition 3 不允許 row column 與 parameter 間使用 >=/<= 等 range 運算子，
# 因此無法靠 subscription.parameter('since_cursor') 動態收縮同步範圍。
# 捲動範圍改由前端 SQLite 本地 WHERE updated_at >= cursor 篩選。
#
# 授權備忘：所有 join 都同時比對 participant_id 與 participant_type（JWT 中 user_type）。
# 缺少 participant_type 檢查會讓其他 morph 類型（例：Admin、Employee）使用相同數字 id
# 假冒 User 身分取得不屬於他們的對話/訊息。
#
# 重新部署備忘（2026-08-14）：本機 MySQL 由多個專案共用，binlog 是整台 server 的。
# 其他 schema 的 RENAME TABLE 會踩到 module-mysql BinLogListener.js:383 未做 null 檢查的
# this.databaseFilter[schema](...)，導致 replicator 無限 crash-restart、checkpoint 永遠不前進。
# 解法是修改本檔（任何內容變更皆可）觸發新版 sync rules，從當前 binlog 位置重做 snapshot。
# 注意：restart 容器沒有用，PowerSync 比對的是本檔內容而非 mtime。

# 再犯備忘（2026-09-09）：同一個坑又踩了一次，這次找到了真正的來源。
# 撞死 replicator 的是 `use `testing_test_18`; rename table `workflow_credentials`
# to `credentials``，來自 database/migrations/2026_08_30_120000_rename_workflow_
# credentials_to_credentials.php。平行測試的 18 個 testing_test_* 資料庫每次
# migrate:fresh 都會跑這一句，所以一輪測試就丟好幾十顆地雷進 binlog。
# PowerSync 起來 6 分鐘內壞掉重開 16 次，checkpoint 停在 binlog.000051，
# 而 MySQL 已經在 binlog.000053，差了約 46000 筆交易，新訊息永遠同步不到。
# 根治的做法已經放進 docker/sail/mysql/local-speed.cnf 的 binlog_do_db，
# 只有 cowork-style-local 會進 binlog，測試資料庫再也碰不到這裡。
# 本檔這次的內容變更是為了觸發新版 sync rules，從乾淨的位置重做 snapshot。

# 換來源備忘（2026-09-14）：replication 來源從 MySQL 換成 PostgreSQL，bucket 儲存
# 從 MongoDB 換成 PostgreSQL（同一台 pgsql server 上的 powersync_storage database）。
# powersync_mongo 容器、它的 volume 與 mongo-rs-init.sh 都已刪除。
# 換來源本來就會讓所有 bucket 作廢、每個客戶端從零重新同步，本檔這次的內容變更
# 是為了讓那次重做從乾淨的位置開始。
#
# 上面兩則備忘寫的那個坑，在 PostgreSQL 上不會再發生，而且是結構上不會：
# MySQL 的 binlog 是整台 server 一份，所以別的專案的 schema 做 RENAME TABLE 會撞死
# 這裡的 replicator；PostgreSQL 的 replication slot 只屬於一個 database，
# 平行測試用的 testing_test_1 .. testing_test_18 是各自獨立的 database，
# 它們做什麼都碰不到這個 slot。docker/sail/mysql/local-speed.cnf 的 binlog_do_db
# 是當時的補救，現在連補救都不需要了。
#
# 客戶端不需要改。來源欄位是 uuid，到 bucket 裡是字串，Flutter 的
# lib/services/powersync/ai_powersync_schema.dart 與網頁版 schema.ts 早就把指到
# 「人」的四個欄位宣告成 text，兩種形狀都裝得下（後端 docs/adr/0093）。

# 時間變 UTC 備忘（2026-09-14）：PostgreSQL 的 173 個時間欄位（67 張表）全部從
# naive timestamp 換成 timestamptz，存的是真 UTC，舊值以台北時間讀入
# （後端 docs/adr/0092、artisan db:times-to-utc）。人看到的時刻沒有移動，變的是形狀。
#
# **這次沒有改任何設定，是欄位型別讓 wire 換了形狀。**
# 票上寫「把 ISO 8601 設定打開」，但那個設定叫 timestamps_iso8601，它的 fixedIn 是
# CompatibilityEdition.SYNC_STREAMS（=2），而本檔最下面是 edition: 3，所以它本來就
# 是開的。從 image 的 /app/packages/sync-rules/dist/compatibility.js 讀出來的。
# 而且它管的只是 T 分隔符，不是 Z —— 換之前 wire 上就已經是
# "2026-09-15T00:28:44.000000" 了。Z 來自 timestamptz，不來自這個設定。
#
# 所以 wire 從 "2026-09-11T20:37:00"（沒有標記的台北時間）
# 變成 "2026-09-11T12:37:00Z"（帶標記的真 UTC），同一個瞬間。
#
# 兩個 client 都不用改。PWA 的 parser（resources/js/workspace/conversation/utils/
# format.ts）本來就兩種形狀都讀，Flutter 的 parseDateTimeOrNull 也是
# （cowork_style_app commit 12b3f96）。沒有標記的那一支要留著：本機還沒重新同步的
# 舊資料仍然是舊形狀。
#
# **唯一真正的危險是未讀數。** PWA 是把 chat_messages.created_at 和
# chat_conversation_participants.last_read_at 當**純文字**比大小的。兩欄走同一條線，
# 所以只要每一列的形狀一致就沒事。**每一個時間欄位的每一列都要在同一次轉換完成，
# 否則跨越那次轉換的對話，未讀數全錯。** 這是轉移那張票要證明的，不是假設的。
#
# 本檔這次的內容變更是為了觸發新版 sync rules，讓 snapshot 從新形狀重做。

# AI 對話分表備忘（2026-10-06）：AI 對話與它的訊息從 chat_* 表搬到自己的兩張表
# ai_conversations 與 ai_messages（後端 docs/adr/0141-an-ai-conversation-has-its-own-two-tables-and-old-app-builds-break-for-a-short-time.md）。
# 下面多了兩條 stream：my_ai_conversations（自動訂閱）與 ai_conversation_messages
# （依 conversation_id 按需訂閱）。兩條 query 都比對
# ai_conversations.creator_id = auth.parameter('user_id')，只有建立對話的人同步得到。
# creator_id 只存 users 表的 key，旁邊沒有 morph 類型欄位，所以上面授權備忘的
# participant_type 比對在這兩條沒有對應的欄位可比。
# 兩條都不是頁面 stream，所以照頁面同步備忘的規則，要求 token 不帶 share_roots。
# 原本四條 stream 一字不改；上線的搬移步驟跑完之後，AI 對話的列就不在它們讀的表裡。
# 本檔這次的內容變更會讓 PowerSync 換一版 sync rules、重做 snapshot。
# 下面兩條 AI stream 與後端 docker/sail/powersync/sync-streams.yaml 的同名 stream
# 逐字相同。後端那一份另有頁面同步計畫的改動（第 3 行的版本、頁面同步備忘、頁面內文
# 備忘、四條聊天 stream 的 share_roots 條件與五條頁面 stream），這一份還沒有。聊天的
# token 不帶 share_roots，所以兩條 AI stream 的這個條件對兩個 client 一律成立；帶
# share_roots 的頁面同步 token 讀不到它們。改其中一邊時，另一邊在同一次上線跟著改。

streams:
  # 使用者的對話列表 — 自動訂閱
  my_conversations:
    auto_subscribe: true
    query: |
      SELECT chat_conversations.*
      FROM chat_conversations
      INNER JOIN chat_conversation_participants
        ON chat_conversations.id = chat_conversation_participants.conversation_id
      WHERE chat_conversation_participants.participant_id = auth.parameter('user_id')
        AND chat_conversation_participants.participant_type = auth.parameter('user_type')
        AND chat_conversations.deleted_at IS NULL

  # 使用者的參與者記錄 — 自動訂閱
  # 用 IN subquery 取代 self-join；避開 alias 問題
  my_participants:
    auto_subscribe: true
    query: |
      SELECT chat_conversation_participants.*
      FROM chat_conversation_participants
      WHERE chat_conversation_participants.conversation_id IN (
        SELECT conversation_id
        FROM chat_conversation_participants
        WHERE participant_id = auth.parameter('user_id')
          AND participant_type = auth.parameter('user_type')
      )

  # 對話的訊息 — 按需訂閱
  conversation_messages:
    query: |
      SELECT chat_messages.*
      FROM chat_messages
      INNER JOIN chat_conversation_participants
        ON chat_conversation_participants.conversation_id = chat_messages.conversation_id
      INNER JOIN chat_conversations
        ON chat_conversations.id = chat_messages.conversation_id
      WHERE chat_messages.conversation_id = subscription.parameter('conversation_id')
        AND chat_conversation_participants.participant_id = auth.parameter('user_id')
        AND chat_conversation_participants.participant_type = auth.parameter('user_type')
        AND chat_messages.deleted_at IS NULL
        AND chat_conversations.deleted_at IS NULL

  # 訊息的 reactions — 按需訂閱
  message_reactions:
    query: |
      SELECT chat_message_reactions.*
      FROM chat_message_reactions
      INNER JOIN chat_messages
        ON chat_messages.id = chat_message_reactions.message_id
      INNER JOIN chat_conversation_participants
        ON chat_conversation_participants.conversation_id = chat_messages.conversation_id
      INNER JOIN chat_conversations
        ON chat_conversations.id = chat_messages.conversation_id
      WHERE chat_messages.conversation_id = subscription.parameter('conversation_id')
        AND chat_conversation_participants.participant_id = auth.parameter('user_id')
        AND chat_conversation_participants.participant_type = auth.parameter('user_type')
        AND chat_messages.deleted_at IS NULL
        AND chat_conversations.deleted_at IS NULL

  # 使用者自己的 AI 對話 — 自動訂閱
  my_ai_conversations:
    auto_subscribe: true
    query: |
      SELECT ai_conversations.*
      FROM ai_conversations
      WHERE ai_conversations.creator_id = auth.parameter('user_id')
        AND ai_conversations.deleted_at IS NULL
        AND auth.parameter('share_roots') IS NULL

  # AI 對話的訊息 — 按需訂閱
  ai_conversation_messages:
    query: |
      SELECT ai_messages.*
      FROM ai_messages
      INNER JOIN ai_conversations
        ON ai_conversations.id = ai_messages.conversation_id
      WHERE ai_messages.conversation_id = subscription.parameter('conversation_id')
        AND ai_conversations.creator_id = auth.parameter('user_id')
        AND ai_messages.deleted_at IS NULL
        AND ai_conversations.deleted_at IS NULL
        AND auth.parameter('share_roots') IS NULL

config:
  edition: 3
